<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FOXCONN AMI BIOS 2008</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:Courier New, monospace;
}

#bios{
width:100vw;
height:100vh;
background:#001a8c;
color:white;
padding:10px;
box-sizing:border-box;
}

.header{
text-align:center;
font-size:22px;
margin-bottom:10px;
}

.main{
border:2px solid white;
height:72%;
display:flex;
}

.col{
width:50%;
padding:20px;
box-sizing:border-box;
}

.col:first-child{
border-right:2px solid white;
}

.item{
padding:6px 12px;
margin-bottom:8px;
font-size:22px;
color:white;
}

.selected{
background:#b00000;
}

.help{
margin-top:10px;
border-top:2px solid white;
padding-top:10px;
font-size:18px;
height:110px;
}

.keys{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.page{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#001a8c;
padding:20px;
box-sizing:border-box;
display:none;
}

.page-title{
text-align:center;
font-size:24px;
margin-bottom:20px;
}

.page-item{
display:flex;
justify-content:space-between;
padding:7px 10px;
font-size:22px;
color:white;
}

.page-selected{
background:#b00000;
}

.popup{
position:absolute;
background:#b00000;
border:2px solid white;
display:none;
z-index:999;
min-width:250px;
}

.popup-item{
padding:6px 20px;
font-size:20px;
color:white;
}

.popup-selected{
background:white;
color:black;
}

.footer{
position:absolute;
bottom:10px;
left:10px;
font-size:18px;
}

</style>
</head>

<body>

<div id="bios">

<div class="header">
CMOS Setup Utility - Copyright (C) 1995-2008, American Megatrends, Inc.
</div>

<div class="main">

<div class="col" id="left"></div>

<div class="col" id="right"></div>

</div>

<div class="help">

<div class="keys">
<div>↑↓←→ : Move</div>
<div>Enter : Select</div>
<div>ESC : Exit</div>
<div>F10 : Save</div>
<div>F1 : Help</div>
</div>

<div id="helpText">
Configure BIOS Settings
</div>

</div>

<div class="footer">
v02.63 (C) Copyright 1995-2008, American Megatrends, Inc.
</div>

</div>

<div class="page" id="page">

<div class="page-title" id="pageTitle"></div>

<div id="pageItems"></div>

</div>

<div class="popup" id="popup"></div>

<script>

const leftMenu = [

"System Information",
"Advanced BIOS Features",
"Fox Central Control Unit",
"Advanced Chipset Features",
"Integrated Peripherals",
"Power Management Setup"

];

const rightMenu = [

"PC Health Status",
"BIOS Security Features",
"Boot Device Priority",
"Load Optimal Defaults",
"Save & Exit Setup",
"Exit Without Saving"

];

const helpMap = {

"System Information":"Display system information and drives.",
"Advanced BIOS Features":"Advanced boot and startup settings.",
"Fox Central Control Unit":"Hardware control and fan settings.",
"Advanced Chipset Features":"Northbridge and Southbridge settings.",
"Integrated Peripherals":"Configure onboard devices and USB.",
"Power Management Setup":"Power and wakeup configuration.",
"PC Health Status":"Hardware temperatures and voltages.",
"BIOS Security Features":"BIOS passwords and protection.",
"Boot Device Priority":"Configure boot order.",
"Load Optimal Defaults":"Load factory settings.",
"Save & Exit Setup":"Save BIOS settings.",
"Exit Without Saving":"Exit without saving."

};

const pages = {

"System Information":[

{name:"System Time",value:"12:00:00",options:[]},
{name:"System Date",value:"01/01/2008",options:[]},
{name:"Primary IDE Master",value:"ATAPI CDROM",options:[]},
{name:"Primary IDE Slave",value:"Not Detected",options:[]},
{name:"SATA Channel 1",value:"WDC WD500GB",options:[]},
{name:"SATA Channel 2",value:"Not Detected",options:[]},
{name:"SATA Channel 3",value:"Not Detected",options:[]},
{name:"SATA Channel 4",value:"Not Detected",options:[]},
{name:"Drive A",value:"1.44M",options:[]},
{name:"Halt On",value:"No Errors",options:["No Errors","All Errors"]},
{name:"BIOS Version",value:"02.63",options:[]},
{name:"Processor Type",value:"Intel Core 2 Duo",options:[]},
{name:"Memory Size",value:"4096MB",options:[]}

],

"Advanced BIOS Features":[

{name:"Quick Boot",value:"Enabled",options:["Enabled","Disabled"]},
{name:"Quiet Boot",value:"Enabled",options:["Enabled","Disabled"]},
{name:"Bootup NumLock",value:"On",options:["On","Off"]},
{name:"USB Boot",value:"Enabled",options:["Enabled","Disabled"]},
{name:"Full Screen Logo",value:"Enabled",options:["Enabled","Disabled"]}

],

"Fox Central Control Unit":[

{name:"CPU Clock",value:"Auto",options:["Auto","Manual"]},
{name:"CPU Voltage",value:"Auto",options:["Auto","1.20V","1.30V"]},
{name:"Smart Fan",value:"Enabled",options:["Enabled","Disabled"]},
{name:"System Fan",value:"Enabled",options:["Enabled","Disabled"]},
{name:"CPU Temperature Warning",value:"70C",options:["60C","70C","80C"]}

],

"Advanced Chipset Features":[

{name:"North Bridge Configuration",value:"Press Enter",options:[]},
{name:"South Bridge Configuration",value:"Press Enter",options:[]}

],

"Integrated Peripherals":[

{name:"USB Configuration",value:"Press Enter",options:[]},
{name:"Onboard LAN",value:"Enabled",options:["Enabled","Disabled"]},
{name:"HD Audio",value:"Enabled",options:["Enabled","Disabled"]},
{name:"SATA Configuration",value:"IDE",options:["IDE","AHCI"]}

],

"USB Configuration":[

{name:"USB Support",value:"Enabled",options:["Enabled","Disabled"]},
{name:"USB 1.1 Controller",value:"Enabled",options:["Enabled","Disabled"]},
{name:"USB 2.0 Controller",value:"Enabled",options:["Enabled","Disabled"]},
{name:"USB Keyboard Support",value:"Enabled",options:["Enabled","Disabled"]},
{name:"USB Mouse Support",value:"Enabled",options:["Enabled","Disabled"]},
{name:"USB Storage",value:"Enabled",options:["Enabled","Disabled"]}

],

"Power Management Setup":[

{name:"ACPI Suspend Type",value:"S3",options:["S1","S3"]},
{name:"PS/2 Keyboard Power On",value:"Disabled",options:["Enabled","Disabled"]},
{name:"PS/2 Mouse Power On",value:"Disabled",options:["Enabled","Disabled"]},
{name:"Restore On AC Power Loss",value:"Off",options:["On","Off"]}

],

"PC Health Status":[

{name:"CPU Temperature",value:"39C",options:[]},
{name:"System Temperature",value:"33C",options:[]},
{name:"CPU Fan Speed",value:"2200RPM",options:[]},
{name:"SYS Fan Speed",value:"1800RPM",options:[]},
{name:"CPU Voltage",value:"1.25V",options:[]},
{name:"+3.3V",value:"3.31V",options:[]},
{name:"+5V",value:"5.04V",options:[]},
{name:"+12V",value:"12.1V",options:[]},
{name:"Smart Fan",value:"Enabled",options:["Enabled","Disabled"]},
{name:"Shutdown Temperature",value:"90C",options:["80C","90C","100C"]},
{name:"Warning Temperature",value:"70C",options:["60C","70C","80C"]}

],

"Boot Device Priority":[

{name:"1st Boot Device",value:"CD/DVD",options:["CD/DVD","Hard Disk","USB","Floppy"]},
{name:"2nd Boot Device",value:"Hard Disk",options:["CD/DVD","Hard Disk","USB","Floppy"]},
{name:"3rd Boot Device",value:"USB",options:["CD/DVD","Hard Disk","USB","Floppy"]},
{name:"Try Other Boot Device",value:"No",options:["Yes","No"]}

]

};

let side = "left";
let leftIndex = 0;
let rightIndex = 0;

function renderMain(){

const l = document.getElementById("left");
const r = document.getElementById("right");

l.innerHTML = "";
r.innerHTML = "";

leftMenu.forEach((x,i)=>{

const d = document.createElement("div");

d.className = "item";

if(side==="left" && i===leftIndex){
d.classList.add("selected");
}

d.innerText = "▶ " + x;

l.appendChild(d);

});

rightMenu.forEach((x,i)=>{

const d = document.createElement("div");

d.className = "item";

if(side==="right" && i===rightIndex){
d.classList.add("selected");
}

d.innerText = "▶ " + x;

r.appendChild(d);

});

const current =
side==="left"
? leftMenu[leftIndex]
: rightMenu[rightIndex];

document.getElementById("helpText").innerText =
helpMap[current];

}

renderMain();

let currentPage = "";
let pageIndex = 0;

function openPage(name){

currentPage = name;

pageIndex = 0;

document.getElementById("page").style.display = "block";

document.getElementById("pageTitle").innerText = name;

renderPage();

}

function getVisibleItems(){

let items = [...pages[currentPage]];

if(currentPage==="USB Configuration"){

const usb11 =
items.find(x=>x.name==="USB 1.1 Controller");

if(usb11.value==="Disabled"){

items =
items.filter(x=>x.name!=="USB 2.0 Controller");

}

}

return items;

}

function renderPage(){

const box =
document.getElementById("pageItems");

box.innerHTML = "";

const items = getVisibleItems();

items.forEach((x,i)=>{

const d = document.createElement("div");

d.className = "page-item";

if(i===pageIndex){
d.classList.add("page-selected");
}

d.innerHTML =
`<span>${x.name}</span><span>[${x.value}]</span>`;

box.appendChild(d);

});

}

let popupIndex = 0;

function openPopup(options,current){

const p = document.getElementById("popup");

p.innerHTML = "";

options.forEach((x,i)=>{

const d = document.createElement("div");

d.className = "popup-item";

if(x===current){
popupIndex=i;
d.classList.add("popup-selected");
}

d.innerText=x;

p.appendChild(d);

});

p.style.display="block";

p.style.left="40%";
p.style.top="35%";

}

window.addEventListener("keydown",e=>{

const page =
document.getElementById("page");

const popup =
document.getElementById("popup");

if(popup.style.display==="block"){

const items = popup.children;

if(e.key==="ArrowDown"){

items[popupIndex].classList.remove("popup-selected");

popupIndex++;

if(popupIndex>=items.length){
popupIndex=0;
}

items[popupIndex].classList.add("popup-selected");

}

else if(e.key==="ArrowUp"){

items[popupIndex].classList.remove("popup-selected");

popupIndex--;

if(popupIndex<0){
popupIndex=items.length-1;
}

items[popupIndex].classList.add("popup-selected");

}

else if(e.key==="Enter"){

const pageItems = getVisibleItems();

const selected = pageItems[pageIndex];

const value = items[popupIndex].innerText;

if(currentPage==="Boot Device Priority"){

const boot =
pages["Boot Device Priority"].slice(0,3);

boot.forEach(x=>{

if(x.value===value){

x.value = selected.value;

}

});

}

selected.value = value;

popup.style.display="none";

renderPage();

}

else if(e.key==="Escape"){

popup.style.display="none";

}

return;

}

if(page.style.display==="block"){

const items = getVisibleItems();

if(e.key==="ArrowDown"){

pageIndex++;

if(pageIndex>=items.length){
pageIndex=0;
}

renderPage();

}

else if(e.key==="ArrowUp"){

pageIndex--;

if(pageIndex<0){
pageIndex=items.length-1;
}

renderPage();

}

else if(e.key==="Enter"){

const item = items[pageIndex];

if(item.name==="USB Configuration"){

openPage("USB Configuration");

return;

}

if(item.options.length>0){

openPopup(item.options,item.value);

}

}

else if(e.key==="Escape"){

page.style.display="none";

}

return;

}

if(e.key==="ArrowDown"){

if(side==="left"){

leftIndex++;

if(leftIndex>=leftMenu.length){
leftIndex=0;
}

}else{

rightIndex++;

if(rightIndex>=rightMenu.length){
rightIndex=0;
}

}

renderMain();

}

else if(e.key==="ArrowUp"){

if(side==="left"){

leftIndex--;

if(leftIndex<0){
leftIndex=leftMenu.length-1;
}

}else{

rightIndex--;

if(rightIndex<0){
rightIndex=rightMenu.length-1;
}

}

renderMain();

}

else if(e.key==="ArrowLeft"){

side="left";

renderMain();

}

else if(e.key==="ArrowRight"){

side="right";

renderMain();

}

else if(e.key==="Enter"){

const selected =
side==="left"
? leftMenu[leftIndex]
: rightMenu[rightIndex];

if(pages[selected]){

openPage(selected);

}

}

});

</script>

</body>
</html>
