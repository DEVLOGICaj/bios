<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMOS Setup Utility - AMI BIOS Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bios-container">
        <div class="bios-header" id="bios-header-text">
            CMOS Setup Utility - Copyright (C) 1985-2008, American Megatrends, Inc.
        </div>
       
        <div class="bios-subheader" id="bios-subheader-text">System Information</div>

        <div class="bios-main" id="bios-main-content">
            </div>

        <div class="bios-footer">
            <div class="footer-row" id="footer-controls">
                ↑↓→←:Move  Enter:Select  +/-/:Value  F10:Save  ESC:Exit  F1:General Help
            </div>
            <div class="footer-description" id="desc-text">
                Configure Time and Date. Display System Information...
            </div>
        </div>

        <div class="options-popup" id="options-popup">
            <div class="popup-title">Options</div>
            <div class="popup-content" id="popup-options-list">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
